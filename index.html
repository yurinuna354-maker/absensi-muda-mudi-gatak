<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Pengajian Muda-Mudi Desa Gatak</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#203126;--muted:#68786c;--line:#dce6dc;--green:#2f6842;--soft:#e8f1e6;--red:#a83e3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--card);border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2}.brand b{display:block}.brand small,.muted,small{color:var(--muted)}.pill{background:var(--soft);color:var(--green);border-radius:30px;padding:6px 10px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 68px)}aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;margin-bottom:4px;color:var(--muted);font-weight:650}.nav.active,.nav:hover{background:var(--soft);color:var(--green)}main{padding:26px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:20px}.head h1{margin:4px 0;font-size:28px}.head p{margin:0;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--green);font-weight:800}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 13px;font-weight:700;color:var(--ink)}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.danger{color:var(--red)}.field{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.group{display:flex;flex-direction:column;gap:5px}.group label{font-size:12px;font-weight:700;color:var(--muted)}.full{grid-column:1/-1}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar .field{width:auto;flex:1;min-width:180px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{background:#f6f8f5;color:var(--muted);font-size:10px;text-transform:uppercase}tr:last-child td{border-bottom:0}.notice{background:var(--soft);border-radius:10px;padding:12px;margin:12px 0;color:#3f5945;font-size:13px}.error{background:#fff0f0;color:#8b2929}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.stat small{display:block}.stat strong{display:block;font-size:27px;margin-top:5px}.hidden{display:none!important}.empty{text-align:center;padding:28px;color:var(--muted)}.actions{display:flex;gap:6px}.footer{font-size:11px;color:var(--muted);margin-top:16px}.mobile-note{display:none}@media(max-width:760px){.layout{display:block}aside{position:sticky;top:65px;z-index:1;display:flex;overflow:auto;padding:7px;border-right:0;border-bottom:1px solid var(--line);gap:4px}.nav{white-space:nowrap;width:auto;margin:0;padding:9px;font-size:12px}main{padding:16px 12px 30px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.head h1{font-size:23px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:12px}.mobile-note{display:block}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>☪ MUDA-MUDI DESA GATAK</b><small>Sistem Informasi Absensi Pengajian</small></div><span class="pill" id="connection">Belum terhubung</span></header>
<div class="layout"><aside>
<button class="nav active" data-page="dashboard">▦ Dashboard</button>
<button class="nav" data-page="members">♧ Data Anggota</button>
<button class="nav" data-page="events">▤ Jadwal Pengajian</button>
<button class="nav" data-page="attendance">✓ Absensi</button>
<button class="nav" data-page="reports">▥ Rekap Absensi</button>
<button class="nav" data-page="settings">⚙ Pengaturan</button>
</aside><main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const configKey='gatak_supabase_config';let db=null,page='dashboard',members=[],events=[],attendance=[],loading=false;
function config(){try{return JSON.parse(localStorage.getItem(configKey)||'{}')}catch{return {}}}
function client(){const c=config();if(!c.url||!c.key)throw Error('Buka Pengaturan, lalu masukkan Project URL dan Publishable Key.');if(!window.supabase)throw Error('Library Supabase belum termuat. Periksa koneksi internet.');if(!db)db=window.supabase.createClient(c.url,c.key);return db}
function head(title,desc,actions=''){return `<div class="head"><div><div class="eyebrow">DESA GATAK · MUDA-MUDI</div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}
function panel(title,body){return `<section class="panel"><h3>${title}</h3>${body}</section>`}
function msg(t,error=false){return `<div class="notice ${error?'error':''}">${esc(t)}</div>`}
function table(headers,rows,empty){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
async function reload(){try{const c=client(),{data:s,error:se}=await c.auth.getSession();if(se)throw se;if(!s.session)throw Error('Belum login. Buka Pengaturan dan login sebagai admin.');const [m,e,a]=await Promise.all([c.from('members').select('*').order('full_name'),c.from('events').select('*').order('event_date',{ascending:false}),c.from('attendance').select('*').order('checked_at',{ascending:false})]);if(m.error)throw Error('Tabel members: '+m.error.message);if(e.error)throw Error('Tabel events: '+e.error.message);if(a.error)throw Error('Tabel attendance: '+a.error.message);members=m.data||[];events=e.data||[];attendance=a.data||[];$('#connection').textContent='Supabase terhubung';return true}catch(e){$('#connection').textContent='Perlu login/koneksi';renderError(e.message);return false}}
function renderError(message){$('#main').innerHTML=head('Koneksi belum siap','Periksa konfigurasi dan izin database.')+panel('Belum dapat memuat data',msg(message,true)+`<button class="btn primary" id="toSettings">Buka Pengaturan</button> <button class="btn" id="retry">Coba lagi</button>`);$('#toSettings').onclick=()=>go('settings');$('#retry').onclick=()=>go(page)}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function render(){if(page==='settings')return settingsPage();if(page==='dashboard')return dashboard();if(page==='members')return membersPage();if(page==='events')return eventsPage();if(page==='attendance')return attendancePage();if(page==='reports')return reportsPage()}
function dashboard(){const active=members.filter(m=>m.is_active).length,today=new Date().toISOString().slice(0,10),present=attendance.filter(a=>(a.checked_at||'').slice(0,10)===today&&a.attendance_status==='Hadir').length;$('#main').innerHTML=head('Dashboard','Ringkasan data dari Supabase.')+`<div class="stats"><div class="stat"><small>Anggota aktif</small><strong>${active}</strong></div><div class="stat"><small>Hadir hari ini</small><strong>${present}</strong></div><div class="stat"><small>Jadwal</small><strong>${events.length}</strong></div><div class="stat"><small>Catatan absensi</small><strong>${attendance.length}</strong></div></div>`+panel('Kegiatan terbaru',table(['Kegiatan','Tanggal','Lokasi','Status'],events.slice(0,8).map(e=>`<tr><td>${esc(e.title)}</td><td>${esc(e.event_date)}</td><td>${esc(e.location||'-')}</td><td>${esc(e.status)}</td></tr>`).join(''),'Belum ada jadwal.'))+`<p class="footer">Semua angka di atas dibaca dari database online, bukan data demo.</p>`}
function membersPage(){const rows=members.map(m=>`<tr><td>${esc(m.member_code||'-')}</td><td>${esc(m.full_name)}</td><td>${esc(m.gender||'-')}</td><td>${esc(m.address||'-')}</td><td>${m.is_active?'Aktif':'Nonaktif'}</td><td><div class="actions"><button class="btn" data-editm="${m.id}">Edit</button><button class="btn" data-activem="${m.id}">${m.is_active?'Nonaktifkan':'Aktifkan'}</button></div></td></tr>`).join('');$('#main').innerHTML=head('Data Anggota','Tambah dan perbarui data pada tabel members.')+panel('Form anggota',`<form id="memberForm"><input type="hidden" id="mid"><div class="grid"><div class="group"><label>Nama lengkap *</label><input class="field" id="mname" required maxlength="100"></div><div class="group"><label>Jenis kelamin</label><select class="field" id="mgender"><option>Laki-laki</option><option>Perempuan</option></select></div><div class="group"><label>Alamat / RT</label><input class="field" id="maddress"></div><div class="group"><label>Nomor HP</label><input class="field" id="mphone"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary">Simpan ke Supabase</button><button class="btn" type="button" id="clearM">Kosongkan</button></div></form>`)+panel('Daftar anggota',table(['Kode','Nama','Jenis kelamin','Alamat','Status','Aksi'],rows,'Belum ada anggota di database.'));$('#clearM').onclick=()=>$('#memberForm').reset();$('#memberForm').onsubmit=async ev=>{ev.preventDefault();try{const c=client(),id=$('#mid').value,p={full_name:$('#mname').value.trim(),gender:$('#mgender').value,address:$('#maddress').value.trim(),phone:$('#mphone').value.trim()};let r;if(id)r=await c.from('members').update(p).eq('id',id);else r=await c.from('members').insert({...p,member_code:'GAT-'+Date.now().toString().slice(-8),qr_token:crypto.randomUUID(),is_active:true});if(r.error)throw r.error;await refreshPage('Anggota berhasil disimpan.')}catch(e){alert('Gagal menyimpan anggota: '+e.message)}};document.querySelectorAll('[data-editm]').forEach(b=>b.onclick=()=>{const m=members.find(x=>x.id===b.dataset.editm);$('#mid').value=m.id;$('#mname').value=m.full_name||'';$('#mgender').value=m.gender||'Laki-laki';$('#maddress').value=m.address||'';$('#mphone').value=m.phone||'';$('#memberForm').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-activem]').forEach(b=>b.onclick=async()=>{const m=members.find(x=>x.id===b.dataset.activem);try{const {error}=await client().from('members').update({is_active:!m.is_active}).eq('id',m.id);if(error)throw error;await refreshPage('Status anggota diperbarui.')}catch(e){alert(e.message)}})}
function eventsPage(){const rows=events.map(e=>`<tr><td><b>${esc(e.title)}</b><br><small>${esc(e.theme||'')}</small></td><td>${esc(e.event_date)}</td><td>${esc(e.start_time||'-')}</td><td>${esc(e.location||'-')}</td><td>${esc(e.status)}</td><td><button class="btn" data-eventtoggle="${e.id}">${e.status==='open'?'Tutup sesi':'Buka sesi'}</button></td></tr>`).join('');$('#main').innerHTML=head('Jadwal Pengajian','Kelola jadwal pada tabel events.')+panel('Tambah jadwal',`<form id="eventForm"><div class="grid"><div class="group full"><label>Nama kegiatan *</label><input class="field" id="etitle" required></div><div class="group"><label>Tema</label><input class="field" id="etheme"></div><div class="group"><label>Tanggal *</label><input class="field" id="edate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="group"><label>Jam</label><input class="field" id="etime" type="time" value="19:30"></div><div class="group"><label>Lokasi</label><input class="field" id="elocation"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary">Simpan jadwal online</button></div></form>`)+panel('Daftar jadwal',table(['Kegiatan','Tanggal','Jam','Lokasi','Status','Aksi'],rows,'Belum ada jadwal di database.'));$('#eventForm').onsubmit=async ev=>{ev.preventDefault();try{const {error}=await client().from('events').insert({title:$('#etitle').value.trim(),theme:$('#etheme').value.trim(),event_date:$('#edate').value,start_time:$('#etime').value||null,location:$('#elocation').value.trim(),status:'draft'});if(error)throw error;await refreshPage('Jadwal berhasil disimpan.')}catch(e){alert('Gagal menyimpan jadwal: '+e.message)}};document.querySelectorAll('[data-eventtoggle]').forEach(b=>b.onclick=async()=>{const e=events.find(x=>x.id===b.dataset.eventtoggle),next=e.status==='open'?'closed':'open';try{const c=client();if(next==='open'){const r=await c.from('events').update({status:'closed'}).eq('status','open');if(r.error)throw r.error}const {error}=await c.from('events').update({status:next}).eq('id',e.id);if(error)throw error;await refreshPage('Status sesi diperbarui.')}catch(err){alert(err.message)}})}
function attendancePage(){const optsM=members.filter(m=>m.is_active).map(m=>`<option value="${m.id}">${esc(m.full_name)} (${esc(m.member_code)})</option>`).join(''),optsE=events.map(e=>`<option value="${e.id}">${esc(e.title)} — ${esc(e.event_date)}</option>`).join('');$('#main').innerHTML=head('Absensi','Catat kehadiran dan simpan langsung ke Supabase.')+panel('Catat kehadiran',`<form id="attendanceForm"><div class="grid"><div class="group"><label>Kegiatan *</label><select class="field" id="aevent" required><option value="">Pilih kegiatan</option>${optsE}</select></div><div class="group"><label>Anggota *</label><select class="field" id="amember" required><option value="">Pilih anggota</option>${optsM}</select></div><div class="group"><label>Status</label><select class="field" id="astatus"><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option></select></div><div class="group"><label>Keterangan</label><input class="field" id="anote" maxlength="250"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary">Simpan absensi online</button></div></form>${msg('Untuk saat ini pilih anggota dari daftar. Pemindaian QR langsung belum diaktifkan.')}`)}
function reportsPage(){const rows=attendance.map(a=>{const m=members.find(x=>x.id===a.member_id),e=events.find(x=>x.id===a.event_id);return `<tr><td>${esc(a.checked_at?new Date(a.checked_at).toLocaleString('id-ID'):'-')}</td><td>${esc(m?.full_name||a.member_id)}</td><td>${esc(e?.title||a.event_id)}</td><td>${esc(a.attendance_status)}</td><td>${esc(a.note||'-')}</td><td><button class="btn danger" data-delatt="${a.id}">Hapus</button></td></tr>`}).join('');$('#main').innerHTML=head('Rekap Absensi','Riwayat catatan yang tersimpan di tabel attendance.')+panel('Catatan kehadiran',`<div class="toolbar"><button class="btn" id="exportCsv">Ekspor CSV</button><button class="btn" id="reloadData">Muat ulang</button></div>`+table(['Waktu','Anggota','Kegiatan','Status','Keterangan','Aksi'],rows,'Belum ada catatan absensi.'));$('#reloadData').onclick=()=>refreshPage();$('#exportCsv').onclick=()=>{const data=[['Waktu','Anggota','Kegiatan','Status','Keterangan'],...attendance.map(a=>[a.checked_at||'',members.find(m=>m.id===a.member_id)?.full_name||'',events.find(e=>e.id===a.event_id)?.title||'',a.attendance_status,a.note||''])],csv=data.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='rekap-absensi-gatak.csv';a.click();URL.revokeObjectURL(url)};document.querySelectorAll('[data-delatt]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus catatan absensi ini?'))return;try{const {error}=await client().from('attendance').delete().eq('id',b.dataset.delatt);if(error)throw error;await refreshPage('Catatan dihapus.')}catch(e){alert(e.message)}})}
function settingsPage(){const c=config();$('#main').innerHTML=head('Pengaturan','Atur koneksi dan login admin Supabase.')+panel('Koneksi Supabase',`<form id="configForm"><div class="grid"><div class="group full"><label>Project URL</label><input class="field" id="url" type="url" required placeholder="https://xxxx.supabase.co" value="${esc(c.url||'')}"></div><div class="group full"><label>Publishable Key (sb_publishable_...)</label><input class="field" id="key" required autocomplete="off" placeholder="sb_publishable_..." value="${esc(c.key||'')}"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary">Simpan konfigurasi</button><button class="btn" type="button" id="testConnection">Uji akses tiga tabel</button></div></form><div id="configMsg"></div>`)+panel('Login admin',`<form id="loginForm"><div class="grid"><div class="group"><label>Email admin</label><input class="field" type="email" id="email" required autocomplete="username"></div><div class="group"><label>Kata sandi akun admin</label><input class="field" type="password" id="password" required autocomplete="current-password"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary">Login</button><button class="btn" type="button" id="logout">Logout</button></div></form><div id="loginMsg"></div>`)+`<p class="footer">Gunakan hanya Publishable Key di browser. Jangan pernah memasukkan service_role/secret key. Pastikan Row Level Security (RLS) aktif dan kebijakan tabel mengizinkan akun admin yang sesuai.</p>`;$('#configForm').onsubmit=e=>{e.preventDefault();const url=$('#url').value.trim().replace(/\/$/,''),key=$('#key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))return $('#configMsg').innerHTML=msg('Format Project URL belum benar.',true);if(!key.startsWith('sb_publishable_'))return $('#configMsg').innerHTML=msg('Gunakan Publishable Key, bukan secret/service_role key.',true);localStorage.setItem(configKey,JSON.stringify({url,key}));db=null;$('#configMsg').innerHTML=msg('Konfigurasi tersimpan di browser ini. Sekarang login admin lalu uji akses tabel.')};$('#testConnection').onclick=async()=>{try{const c=client(),{data:s,error:se}=await c.auth.getSession();if(se)throw se;if(!s.session)throw Error('Login admin terlebih dahulu.');const results=await Promise.all(['members','events','attendance'].map(t=>c.from(t).select('id').limit(1)));const bad=results.findIndex(x=>x.error);if(bad>=0)throw Error(['members','events','attendance'][bad]+': '+results[bad].error.message);$('#configMsg').innerHTML=msg('Berhasil: ketiga tabel (members, events, attendance) dapat dibaca.')}catch(e){$('#configMsg').innerHTML=msg(e.message,true)}};$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const {data,error}=await client().auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)throw error;$('#loginMsg').innerHTML=msg('Login berhasil sebagai '+data.user.email+'. Memuat data online...');await refreshPage('Login berhasil. Data dimuat dari Supabase.')}catch(err){$('#loginMsg').innerHTML=msg(err.message,true)}};$('#logout').onclick=async()=>{try{const {error}=await client().auth.signOut();if(error)throw error;$('#loginMsg').innerHTML=msg('Logout berhasil.')}catch(e){$('#loginMsg').innerHTML=msg(e.message,true)}}}
async function refreshPage(message=''){if(!await reload())return;render();if(message)alert(message)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.addEventListener('submit',async e=>{if(e.target.id!=='attendanceForm')return;e.preventDefault();try{const c=client(),p={event_id:$('#aevent').value,member_id:$('#amember').value,attendance_status:$('#astatus').value,checked_at:new Date().toISOString(),note:$('#anote').value.trim()};const {data:old,error:findErr}=await c.from('attendance').select('id').eq('event_id',p.event_id).eq('member_id',p.member_id).maybeSingle();if(findErr)throw findErr;const r=old?await c.from('attendance').update(p).eq('id',old.id):await c.from('attendance').insert(p);if(r.error)throw r.error;await refreshPage('Absensi berhasil disimpan ke database.')}catch(err){alert('Gagal menyimpan absensi: '+err.message)}});
(async()=>{if(await reload())render();else settingsPage()})();
})();
</script>
</body>
</html>
