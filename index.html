ms:center;gap:10px;margin-bottom:16px}.panelhead h2{font-size:16px;margin:0}.panelhead p{font-size:12px;color:var(--muted);margin:4px 0 0}.activity{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.activity:last-child{border-bottom:0}.persondot{width:38px;height:38px;border-radius:12px;background:var(--surface2);color:var(--green);display:grid;place-items:center;font-weight:800;flex-shrink:0}.grow{flex:1;min-width:0}.activity strong{display:block;font-size:13px}.activity small{color:var(--muted);font-size:11px}.status{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:var(--surface2);color:var(--green);white-space:nowrap}.status.warn{color:#9a7628;background:light-dark(#fbf2d9,#40351d)}.status.bad{color:var(--danger);background:light-dark(#fbe8e8,#402727)}.eventbox{border-radius:14px;background:var(--surface2);padding:17px;margin-bottom:12px}.eventbox .date{font-size:11px;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.7px}.eventbox h3{font-size:16px;margin:7px 0}.eventbox p{font-size:12px;color:var(--muted);margin:0 0 12px}.progress{height:7px;background:var(--border);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:99px}.progressline{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:8px 0 14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.field{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);min-width:0;outline:none}.field:focus{border-color:var(--green);box-shadow:0 0 0 3px light-dark(#dcebdd,#293e2d)}.search{flex:1;min-width:180px}.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;background:var(--bg);padding:13px 14px}td{padding:13px 14px;border-top:1px solid var(--border)}.empty{text-align:center;padding:35px;color:var(--muted)}.scanlayout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:18px}.camera{background:#15251a;border-radius:14px;min-height:285px;color:#dcebdd;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;position:relative;overflow:hidden}.scanframe{width:148px;height:148px;border:3px solid #a8d8a9;border-radius:20px;position:relative;margin-bottom:18px}.scanframe:before,.scanframe:after{content:"";position:absolute;background:#15251a}.scanframe:before{width:30px;height:5px;left:55px;top:-4px}.scanframe:after{width:5px;height:30px;left:-4px;top:55px}.camera p{font-size:12px;color:#b4c7b8;max-width:260px;margin:6px auto 15px}.camera video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:none}.camera.live video{display:block}.camera.live .cameraoverlay{z-index:1;background:rgba(15,30,20,.35);width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.camera.live .cameraoverlay p{color:#fff}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.formgroup{display:flex;flex-direction:column;gap:6px}.formgroup label{font-size:12px;color:var(--muted);font-weight:700}.formgroup.full{grid-column:1/-1}.formgroup .field{width:100%}.notice{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface2);font-size:12px;color:var(--muted);margin-top:13px}.notice strong{color:var(--text)}.result{border-radius:12px;padding:14px;margin-top:14px;background:var(--surface2);display:none}.result.show{display:block}.result strong{display:block;margin-bottom:3px}.result.success{border:1px solid light-dark(#b9d9bc,#3b6943)}.result.error{border:1px solid light-dark(#efc6c6,#7a3c3c)}.memberqr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.qrcard{border:1px solid var(--border);border-radius:13px;padding:14px;text-align:center}.qrvisual{width:94px;height:94px;margin:0 auto 9px;background:white;padding:6px;border-radius:5px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:1px}.qrvisual span{background:#fff}.qrvisual span.on{background:#1c2b20}.qrcard strong{font-size:12px;display:block}.qrcard small{color:var(--muted);font-size:10px}.chart{display:flex;align-items:end;gap:12px;height:150px;padding:10px 4px 0}.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(34px,75%);background:var(--green);border-radius:7px 7px 2px 2px;min-height:4px;position:relative}.barlabel{font-size:10px;color:var(--muted)}.barvalue{font-size:10px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--surface);padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:calc(100vw - 44px);display:none}.toast.show{display:block;animation:pop .2s ease}@keyframes pop{from{transform:translateY(8px);opacity:.5}to{transform:translateY(0);opacity:1}}.mobilemenu{display:none}.muted{color:var(--muted)}.hidden{display:none!important}.footnote{font-size:11px;color:var(--muted);margin-top:14px}.filterrow{display:flex;gap:8px;flex-wrap:wrap}.filterrow .field{padding:8px 10px;font-size:12px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.contentgrid,.scanlayout{grid-template-columns:1fr}.layout{grid-template-columns:200px minmax(0,1fr)}.main{padding:22px}.sidebar{padding:18px 10px}}@media(max-width:700px){.topbar{height:66px;padding:0 15px}.brand strong{font-size:13px}.brand small{font-size:10px}.logo{height:38px;width:38px}.topright .pill{display:none}.layout{display:block}.sidebar{position:fixed;z-index:10;bottom:0;left:0;right:0;min-height:0;height:68px;border-right:0;border-top:1px solid var(--border);padding:6px 7px;display:flex;justify-content:space-around;gap:2px;background:var(--surface)}.navlabel,.sidefoot{display:none}.nav{flex-direction:column;gap:3px;width:16.66%;padding:6px 2px;margin:0;text-align:center;font-size:9px;border-radius:8px}.nav .ico{font-size:17px}.main{padding:22px 14px 92px}.pagehead h1{font-size:24px}.pagehead{align-items:flex-start}.pagehead .btn{font-size:11px;padding:9px}.stats{gap:10px}.stat{padding:13px}.statnum{font-size:25px}.statrow{font-size:10px}.staticon{width:29px;height:29px}.panel{padding:15px}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.memberqr{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .btn{flex:1}.search{min-width:100%}.camera{min-height:260px}.footnote{padding-bottom:5px}}

<body><div class="app" id="app">
<header class="topbar"><div class="brand"><div class="logo">☪</div><div><strong>MUDA-MUDI DESA GATAK</strong><small>Sistem Informasi Absensi Pengajian</small></div></div><div class="topright"><span class="pill">● Mode Demo Interaktif</span><div class="avatar">A</div></div></header>
<div class="layout"><aside class="sidebar"><div class="navlabel">MENU UTAMA</div><button class="nav active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button><button class="nav" data-page="scan"><span class="ico">▣</span>Scan Absensi</button><button class="nav" data-page="members"><span class="ico">♧</span>Data Anggota</button><button class="nav" data-page="events"><span class="ico">▤</span>Jadwal Pengajian</button><button class="nav" data-page="reports"><span class="ico">▥</span>Rekap Absensi</button><button class="nav" data-page="settings"><span class="ico">⚙</span>Pengaturan</button><div class="sidefoot"><strong>🌿 Pengajian Rutin</strong><p>Kelola kehadiran lebih rapi, cepat, dan transparan.</p></div></aside>
<main class="main" id="main"></main></div><div class="toast" id="toast" role="status"></div></div>
<script>
(()=>{'use strict';
const seedMembers=[{id:'GAT-001',name:'Ahmad Fauzi',gender:'Laki-laki',address:'RT 01',phone:'',active:true,token:'QR-GAT-001'},{id:'GAT-002',name:'Siti Aisyah',gender:'Perempuan',address:'RT 02',phone:'',active:true,token:'QR-GAT-002'},{id:'GAT-003',name:'Muhammad Rizki',gender:'Laki-laki',address:'RT 01',phone:'',active:true,token:'QR-GAT-003'},{id:'GAT-004',name:'Nurul Hidayah',gender:'Perempuan',address:'RT 03',phone:'',active:true,token:'QR-GAT-004'},{id:'GAT-005',name:'Dimas Pratama',gender:'Laki-laki',address:'RT 02',phone:'',active:true,token:'QR-GAT-005'},{id:'GAT-006',name:'Dewi Lestari',gender:'Perempuan',address:'RT 04',phone:'',active:true,token:'QR-GAT-006'},{id:'GAT-007',name:'Fajar Maulana',gender:'Laki-laki',address:'RT 03',phone:'',active:true,token:'QR-GAT-007'},{id:'GAT-008',name:'Putri Ramadhani',gender:'Perempuan',address:'RT 01',phone:'',active:true,token:'QR-GAT-008'}];
const seedEvents=[{id:'EVT-001',name:'Pengajian Rutin Muda-Mudi',theme:'Mempererat Ukhuwah Islamiyah',date:new Date().toISOString().slice(0,10),time:'19:30',location:'Masjid Desa Gatak',status:'open'},{id:'EVT-002',name:'Kajian Akhlak Remaja',theme:'Adab dalam Kehidupan Sehari-hari',date:'2026-10-24',time:'19:30',location:'Balai Desa Gatak',status:'draft'}];
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let members=load('gatak_members',seedMembers),events=load('gatak_events',seedEvents),records=load('gatak_records',[]),page='dashboard',activeEvent=events.find(e=>e.status==='open')?.id||events[0]?.id||'',filter='';
function load(k,seed){try{let x=localStorage.getItem(k);return x?JSON.parse(x):seed}catch{return seed}}
function save(){try{localStorage.setItem('gatak_members',JSON.stringify(members));localStorage.setItem('gatak_events',JSON.stringify(events));localStorage.setItem('gatak_records',JSON.stringify(records))}catch{}}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function today(){return new Date().toISOString().slice(0,10)}function fmtDate(d){if(!d)return '-';return new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}function fmtTime(d){return d?new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-'}
function eventName(id){return events.find(e=>e.id===id)?.name||'Kegiatan dihapus'}function activeCount(){return members.filter(m=>m.active).length}function sessionCount(eventId){return records.filter(r=>r.eventId===eventId&&r.status==='Hadir').length}function initials(n){return n.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function pageHead(title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">DESA GATAK · MUDA-MUDI</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,num,icon,note){return `<div class="stat"><div class="statrow"><span>${label}</span><span class="staticon">${icon}</span></div><div class="statnum">${num}</div><div class="statnote">${note}</div></div>`}
function actRow(r){let m=members.find(x=>x.id===r.memberId);return `<div class="activity"><div class="persondot">${initials(m?.name||'Anggota')}</div><div class="grow"><strong>${esc(m?.name||r.memberId)}</strong><small>${esc(eventName(r.eventId))} · ${fmtTime(r.time)}</small></div><span class="status">Hadir</span></div>`}
function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let main=$('#main');if(page==='dashboard')main.innerHTML=dashboard();else if(page==='scan')main.innerHTML=scanPage();else if(page==='members')main.innerHTML=membersPage();else if(page==='events')main.innerHTML=eventsPage();else if(page==='reports')main.innerHTML=reportsPage();else main.innerHTML=settingsPage();bindPage()}
function dashboard(){let todayRecs=records.filter(r=>r.date===today()&&r.status==='Hadir'),last=records.slice().reverse().slice(0,5),ev=events.find(e=>e.id===activeEvent);let next=events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];let pct=activeCount()?Math.round(todayRecs.length/activeCount()*100):0;let vals=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10);vals.push({label:d.toLocaleDateString('id-ID',{weekday:'short'}),count:records.filter(r=>r.date===key&&r.status==='Hadir').length})}let max=Math.max(1,...vals.map(x=>x.count));return `${pageHead('Dashboard','Ringkasan kehadiran dan aktivitas pengajian.',`<button class="btn primary" data-go="scan">▣ &nbsp; Mulai Scan</button>`)}<section class="stats">${stat('Anggota Aktif',activeCount(),'♧','Terdaftar di sistem')}${stat('Hadir Hari Ini',todayRecs.length,'✓','Catatan scan hari ini')}${stat('Belum Hadir',Math.max(0,activeCount()-todayRecs.length),'◷','Anggota aktif dikurangi yang hadir')}${stat('Kegiatan Terjadwal',events.length,'▤','Seluruh jadwal tersimpan')}</section><div class="contentgrid"><div><section class="panel"><div class="panelhead"><div><h2>Aktivitas Kehadiran</h2><p>Catatan scan terbaru</p></div><button class="btn small" data-go="reports">Lihat semua →</button></div>${last.length?last.map(actRow).join(''):`<div class="empty">Belum ada catatan scan. Mulai absensi untuk melihat aktivitas di sini.</div>`}</section><section class="panel"><div class="panelhead"><div><h2>Tren Kehadiran</h2><p>7 hari terakhir</p></div><span class="status">Harian</span></div><div class="chart">${vals.map(v=>`<div class="barcol"><span class="barvalue">${v.count}</span><div class="bar" style="height:${Math.max(4,v.count/max*100)}%"></div><span class="barlabel">${v.label}</span></div>`).join('')}</div></section></div><div><section class="panel"><div class="panelhead"><div><h2>Kegiatan Aktif</h2><p>Sesi absensi yang tersedia</p></div></div>${ev?`<div class="eventbox"><div class="date">● SESI ${ev.status==='open'?'TERBUKA':'BELUM DIBUKA'}</div><h3>${esc(ev.name)}</h3><p>▦ ${fmtDate(ev.date)} · ${esc(ev.time)}<br>⌖ ${esc(ev.location)}</p><div class="progress"><span style="width:${Math.min(100,activeCount()?sessionCount(ev.id)/activeCount()*100:0)}%"></span></div><div class="progressline"><span>${sessionCount(ev.id)} hadir tercatat</span><span>${activeCount()} anggota aktif</span></div><button class="btn primary" style="width:100%" data-go="scan">Buka Scanner →</button></div>`:`<div class="empty">Belum ada kegiatan. Tambahkan jadwal terlebih dahulu.</div>`}<div class="panelhead" style="margin-top:20px"><div><h2>Jadwal Berikutnya</h2><p>Kegiatan mendatang</p></div></div>${next?`<div class="activity"><div class="persondot">▤</div><div class="grow"><strong>${esc(next.name)}</strong><small>${fmtDate(next.date)} · ${esc(next.time)}</small></div></div>`:`<p class="muted">Belum ada jadwal mendatang.</p>`}</section></div></div><p class="footnote">Demo interaktif · Data disimpan di browser ini dan belum tersambung ke database online.</p>`}
function scanPage(){let ev=events.find(e=>e.id===activeEvent);return `${pageHead('Scan Absensi','Pindai QR Code anggota untuk mencatat kehadiran.') }<div class="scanlayout"><section class="panel"><div class="panelhead"><div><h2>Scanner QR Code</h2><p>Pilih kegiatan dan arahkan QR ke kamera.</p></div><span class="status ${ev?.status==='open'?'':'warn'}">${ev?.status==='open'?'Sesi terbuka':'Sesi tidak terbuka'}</span></div><div class="formgroup" style="margin-bottom:14px"><label for="scanEvent">Kegiatan pengajian</label><select class="field" id="scanEvent">${events.map(e=>`<option value="${e.id}" ${e.id===activeEvent?'selected':''}>${esc(e.name)} — ${fmtDate(e.date)} (${e.status==='open'?'Terbuka':e.status==='closed'?'Ditutup':'Draft'})</option>`).join('')}</select></div><div class="camera" id="camera"><video id="cameraVideo" playsinline muted></video><div class="cameraoverlay"><div class="scanframe">▦</div><strong id="cameraTitle">Kamera belum diaktifkan</strong><p id="cameraText">Aktifkan kamera atau gunakan input token QR untuk simulasi scan.</p><button class="btn primary" id="cameraBtn">◎ Aktifkan Kamera</button></div></div><div class="formgroup" style="margin-top:15px"><label for="qrInput">Input token QR / ID anggota (mode demo)</label><div class="toolbar" style="margin-bottom:0"><input class="field search" id="qrInput" placeholder="Contoh: QR-GAT-001 atau GAT-001"><button class="btn primary" id="submitScan">Verifikasi &amp; Hadir</button></div></div><div class="result" id="scanResult"></div><div class="notice"><strong>Info:</strong> Token demo mengikuti format QR-GAT-001. Untuk produksi, scanner perlu dipasangkan dengan decoder QR dan backend yang aman.</div></section><section class="panel"><div class="panelhead"><div><h2>Daftar Hadir Sesi</h2><p id="sessionCaption">Anggota yang telah dipindai</p></div><span class="status" id="sessionCount">${sessionCount(activeEvent)} hadir</span></div><div id="sessionList">${sessionList()}</div><div class="notice">Anggota hanya dapat tercatat satu kali dalam satu sesi kegiatan.</div></section></div><p class="footnote">Kamera dapat memerlukan izin browser dan HTTPS. Dalam preview ini, input token berfungsi untuk mencoba alur absensi.</p>`}
function sessionList(){let arr=records.filter(r=>r.eventId===activeEvent&&r.status==='Hadir').slice().reverse();return arr.length?arr.map(actRow).join(''):`<div class="empty">Belum ada anggota yang hadir pada sesi ini.</div>`}
function membersPage(){let list=members.filter(m=>(m.name+' '+m.id+' '+m.address).toLowerCase().includes(filter.toLowerCase()));return `${pageHead('Data Anggota','Kelola anggota dan identitas QR Code mereka.',`<button class="btn primary" id="addMember">＋ Tambah Anggota</button>`)}<section class="panel"><div class="toolbar"><input class="field search" id="memberSearch" placeholder="Cari nama, ID, atau RT..." value="${esc(filter)}"><button class="btn" id="exportMembers">↓ Ekspor CSV</button></div><div class="tablewrap"><table><thead><tr><th>ID Anggota</th><th>Nama Lengkap</th><th>Jenis Kelamin</th><th>Alamat / RT</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.map(m=>`<tr><td><strong>${esc(m.id)}</strong></td><td>${esc(m.name)}</td><td>${esc(m.gender)}</td><td>${esc(m.address||'-')}</td><td><span class="status ${m.active?'':'bad'}">${m.active?'Aktif':'Nonaktif'}</span></td><td><button class="btn small" data-qr="${m.id}">QR</button> <button class="btn small" data-edit="${m.id}">Edit</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">Tidak ada anggota yang cocok.</td></tr>`}</tbody></table></div><p class="footnote">Total ${list.length} anggota ditampilkan · QR pada preview berupa ilustrasi, bukan QR produksi yang dapat dipindai.</p></section><section class="panel hidden" id="memberFormPanel"><div class="panelhead"><div><h2 id="memberFormTitle">Tambah Anggota</h2><p>Isi data anggota di bawah ini.</p></div><button class="btn small" id="closeMemberForm">Tutup ×</button></div><form id="memberForm"><input type="hidden" id="editMemberId"><div class="formgrid"><div class="formgroup"><label>Nama lengkap *</label><input class="field" id="mName" required maxlength="100" placeholder="Nama anggota"></div><div class="formgroup"><label>Jenis kelamin</label><select class="field" id="mGender"><option>Laki-laki</option><option>Perempuan</option></select></div><div class="formgroup"><label>Alamat / RT</label><input class="field" id="mAddress" placeholder="Contoh: RT 01"></div><div class="formgroup"><label>Nomor HP (opsional)</label><input class="field" id="mPhone" inputmode="tel" placeholder="08xxxxxxxxxx"></div></div><div class="toolbar" style="margin-top:16px;margin-bottom:0"><button class="btn primary" type="submit">Simpan Anggota</button><button class="btn" type="button" id="cancelMember">Batal</button></div></form></section><section class="panel hidden" id="qrPanel"><div class="panelhead"><div><h2>Kartu Anggota</h2><p>Ilustrasi identitas QR untuk mode demo.</p></div><button class="btn small" id="closeQr">Tutup ×</button></div><div id="qrContent"></div></section>`}
function eventsPage(){return `${pageHead('Jadwal Pengajian','Buat kegiatan dan atur status sesi absensi.',`<button class="btn primary" id="addEvent">＋ Tambah Jadwal</button>`)}<section class="panel"><div class="tablewrap"><table><thead><tr><th>Nama Kegiatan</th><th>Tanggal</th><th>Waktu</th><th>Lokasi</th><th>Status Sesi</th><th>Aksi</th></tr></thead><tbody>${events.map(e=>`<tr><td><strong>${esc(e.name)}</strong><br><small class="muted">${esc(e.theme||'')}</small></td><td>${fmtDate(e.date)}</td><td>${esc(e.time)}</td><td>${esc(e.location)}</td><td><span class="status ${e.status==='open'?'':e.status==='closed'?'bad':'warn'}">${e.status==='open'?'Terbuka':e.status==='closed'?'Ditutup':'Draft'}</span></td><td><button class="btn small" data-toggle-event="${e.id}">${e.status==='open'?'Tutup sesi':e.status==='closed'?'Buka sesi':'Buka sesi'}</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">Belum ada jadwal.</td></tr>`}</tbody></table></div></section><section class="panel hidden" id="eventFormPanel"><div class="panelhead"><div><h2>Tambah Jadwal Pengajian</h2><p>Kegiatan baru akan disimpan pada daftar jadwal.</p></div><button class="btn small" id="closeEventForm">Tutup ×</button></div><form id="eventForm"><div class="formgrid"><div class="formgroup full"><label>Nama kegiatan *</label><input class="field" id="eName" required placeholder="Contoh: Pengajian Rutin Muda-Mudi"></div><div class="formgroup"><label>Tema</label><input class="field" id="eTheme" placeholder="Tema pengajian"></div><div class="formgroup"><label>Tanggal *</label><input class="field" type="date" id="eDate" required value="${today()}"></div><div class="formgroup"><label>Jam mulai</label><input class="field" type="time" id="eTime" value="19:30"></div><div class="formgroup"><label>Lokasi</label><input class="field" id="eLocation" placeholder="Lokasi kegiatan"></div></div><div class="toolbar" style="margin-top:16px;margin-bottom:0"><button class="btn primary" type="submit">Simpan Jadwal</button><button class="btn" type="button" id="cancelEvent">Batal</button></div></form></section>`}
function reportsPage(){let evFilter=$('#reportEvent')?.value||'all';let dateFilter=$('#reportDate')?.value||'';let statusFilter=$('#reportStatus')?.value||'all';let arr=records.filter(r=>(evFilter==='all'||r.eventId===evFilter)&&(!dateFilter||r.date===dateFilter)&&(statusFilter==='all'||r.status===statusFilter));return `${pageHead('Rekap Absensi','Tinjau catatan kehadiran dan ekspor laporan.') }<section class="panel"><div class="toolbar"><select class="field" id="reportEvent"><option value="all">Semua kegiatan</option>${events.map(e=>`<option value="${e.id}" ${evFilter===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select><input class="field" id="reportDate" type="date" value="${esc(dateFilter)}"><select class="field" id="reportStatus"><option value="all">Semua status</option><option ${statusFilter==='Hadir'?'selected':''}>Hadir</option><option ${statusFilter==='Izin'?'selected':''}>Izin</option><option ${statusFilter==='Sakit'?'selected':''}>Sakit</option><option ${statusFilter==='Alpa'?'selected':''}>Alpa</option></select><button class="btn" id="exportReport">↓ Ekspor CSV</button><button class="btn" id="printReport">⎙ Cetak</button></div><div class="stats" style="margin-bottom:15px">${stat('Catatan ditemukan',arr.length,'▤','Sesuai filter')}${stat('Hadir',arr.filter(r=>r.status==='Hadir').length,'✓','Kehadiran tercatat')}${stat('Izin / Sakit',arr.filter(r=>['Izin','Sakit'].includes(r.status)).length,'◷','Perlu keterangan')}${stat('Alpa',arr.filter(r=>r.status==='Alpa').length,'!','Tidak hadir')}</div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Anggota</th><th>Kegiatan</th><th>Waktu</th><th>Status</th><th>Keterangan</th></tr></thead><tbody>${arr.slice().reverse().map(r=>{let m=members.find(m=>m.id===r.memberId);return `<tr><td>${fmtDate(r.date)}</td><td><strong>${esc(m?.name||r.memberId)}</strong><br><small class="muted">${esc(r.memberId)}</small></td><td>${esc(eventName(r.eventId))}</td><td>${fmtTime(r.time)}</td><td><span class="status ${r.status==='Hadir'?'':r.status==='Alpa'?'bad':'warn'}">${esc(r.status)}</span></td><td>${esc(r.note||'-')}</td></tr>`}).join('')||`<tr><td colspan="6" class="empty">Belum ada catatan absensi untuk filter ini.</td></tr>`}</tbody></table></div><p class="footnote">Persentase hadir per kegiatan dihitung dari anggota aktif. Status alpa belum otomatis dibuat pada demo; alpa adalah status yang dicatat secara manual.</p></section>`}
function settingsPage(){return `${pageHead('Pengaturan','Preferensi aplikasi dan informasi penggunaan.') }<section class="panel"><div class="panelhead"><div><h2>Identitas Organisasi</h2><p>Informasi yang tampil pada halaman aplikasi.</p></div><span class="status">Demo</span></div><div class="formgrid"><div class="formgroup full"><label>Nama organisasi</label><input class="field" value="Muda-Mudi Desa Gatak" id="orgName"></div><div class="formgroup"><label>Zona waktu</label><input class="field" value="Asia/Jakarta (WIB)" disabled></div><div class="formgroup"><label>Platform</label><input class="field" value="Website responsif" disabled></div></div><div class="toolbar" style="margin-top:15px"><button class="btn primary" id="saveSettings">Simpan pengaturan lokal</button><button class="btn danger" id="resetDemo">Reset semua data demo</button></div></section><section class="panel"><div class="panelhead"><div><h2>Keamanan dan kesiapan produksi</h2><p>Hal-hal yang harus disiapkan sebelum digunakan secara resmi.</p></div></div><div class="activity"><div class="persondot">1</div><div class="grow"><strong>Hubungkan Supabase</strong><small>Database, login, autentikasi, dan RLS belum terhubung pada preview ini.</small></div><span class="status warn">Belum</span></div><div class="activity"><div class="persondot">2</div><div class="grow"><strong>Pasang QR generator dan decoder produksi</strong><small>QR pada preview hanya ilustrasi dan tidak bisa dipindai.</small></div><span class="status warn">Belum</span></div><div class="activity"><div class="persondot">3</div><div class="grow"><strong>Deploy melalui HTTPS</strong><small>Diperlukan untuk penggunaan kamera yang andal pada perangkat.</small></div><span class="status warn">Belum</span></div><div class="notice"><strong>Penting:</strong> Data demo disimpan pada penyimpanan browser perangkat ini. Jangan memasukkan data pribadi asli atau menggunakannya sebagai absensi resmi sebelum backend dan keamanan produksi diimplementasikan.</div></section>`}
function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if(page==='scan')bindScan();if(page==='members')bindMembers();if(page==='events')bindEvents();if(page==='reports')bindReports();if(page==='settings')bindSettings()}
function go(p){page=p;filter='';render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function showResult(msg,ok){let r=$('#scanResult');r.className='result show '+(ok?'success':'error');r.innerHTML=msg}
function doScan(value){let ev=events.find(e=>e.id===activeEvent);if(!ev){showResult('<strong>Belum ada kegiatan</strong>Tambahkan jadwal terlebih dahulu.',false);return}if(ev.status!=='open'){showResult('<strong>Sesi belum terbuka</strong>Pilih kegiatan dengan sesi absensi terbuka.',false);return}let v=value.trim();let m=members.find(x=>x.token.toLowerCase()===v.toLowerCase()||x.id.toLowerCase()===v.toLowerCase());if(!m){showResult('<strong>QR tidak dikenal</strong>Token atau ID anggota tidak ditemukan.',false);return}if(!m.active){showResult('<strong>Anggota nonaktif</strong>Hubungi admin untuk pemeriksaan data.',false);return}let old=records.find(r=>r.eventId===ev.id&&r.memberId===m.id);if(old){showResult(`<strong>Sudah tercatat</strong>${esc(m.name)} sudah melakukan absensi pada ${fmtTime(old.time)}.`,false);return}let time=new Date().toISOString();records.push({id:'ATT-'+Date.now(),eventId:ev.id,memberId:m.id,status:'Hadir',time,date:today(),note:''});save();showResult(`<strong>✓ Absensi berhasil</strong>${esc(m.name)} · ${esc(m.id)}<br>Waktu tercatat: ${fmtTime(time)} WIB`,true);$('#qrInput').value='';$('#sessionList').innerHTML=sessionList();$('#sessionCount').textContent=sessionCount(activeEvent)+' hadir';toast('Absensi '+m.name+' berhasil dicatat.');}
function bindScan(){let select=$('#scanEvent');select.onchange=()=>{activeEvent=select.value;$('#sessionList').innerHTML=sessionList();$('#sessionCount').textContent=sessionCount(activeEvent)+' hadir';let ev=events.find(e=>e.id===activeEvent);toast(ev?.status==='open'?'Sesi dipilih':'Sesi ini belum terbuka')};$('#submitScan').onclick=()=>doScan($('#qrInput').value);$('#qrInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doScan($('#qrInput').value)}});let stream=null;$('#cameraBtn').onclick=async()=>{let cam=$('#camera'),video=$('#cameraVideo');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cam.classList.remove('live');$('#cameraTitle').textContent='Kamera dihentikan';$('#cameraText').textContent='Gunakan input token QR untuk mencoba absensi demo.';$('#cameraBtn').textContent='◎ Aktifkan Kamera';return}if(!navigator.mediaDevices?.getUserMedia){toast('Kamera tidak didukung di lingkungan ini. Gunakan input token.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();cam.classList.add('live');$('#cameraTitle').textContent='Kamera aktif';$('#cameraText').textContent='Preview ini belum memiliki decoder QR langsung. Gunakan input token di bawah.';$('#cameraBtn').textContent='■ Hentikan Kamera';toast('Kamera aktif. Decoder QR belum tersedia di demo.')}catch(e){toast('Izin kamera gagal atau kamera tidak tersedia. Gunakan input token.')}};}
function openMemberForm(m){$('#memberFormPanel').classList.remove('hidden');$('#memberFormTitle').textContent=m?'Edit Anggota':'Tambah Anggota';$('#editMemberId').value=m?.id||'';$('#mName').value=m?.name||'';$('#mGender').value=m?.gender||'Laki-laki';$('#mAddress').value=m?.address||'';$('#mPhone').value=m?.phone||'';$('#memberFormPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function bindMembers(){$('#memberSearch').oninput=e=>{filter=e.target.value;let pos=e.target.selectionStart;render();let el=$('#memberSearch');el.focus();el.setSelectionRange(pos,pos)};$('#addMember').onclick=()=>openMemberForm();$('#closeMemberForm').onclick=$('#cancelMember').onclick=()=>$('#memberFormPanel').classList.add('hidden');$('#memberForm').onsubmit=e=>{e.preventDefault();let id=$('#editMemberId').value;let name=$('#mName').value.trim();if(!name)return;let data={name,gender:$('#mGender').value,address:$('#mAddress').value.trim(),phone:$('#mPhone').value.trim()};if(id){Object.assign(members.find(m=>m.id===id),data);toast('Data anggota diperbarui.')}else{let n=members.reduce((max,m)=>Math.max(max,parseInt(m.id.split('-')[1])||0),0)+1;let mid='GAT-'+String(n).padStart(3,'0');members.push({id:mid,...data,active:true,token:'QR-'+mid});toast('Anggota baru berhasil ditambahkan.')}save();render();$('#memberFormPanel').classList.remove('hidden')};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openMemberForm(members.find(m=>m.id===b.dataset.edit)));document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{let m=members.find(x=>x.id===b.dataset.qr);$('#qrPanel').classList.remove('hidden');let bits=Array.from({length:81},(_,i)=>((Math.imul(i+7,m.id.length*13)+m.id.charCodeAt(4||0)*31+i*i)%7)<3);$('#qrContent').innerHTML=`<div class="memberqr"><div class="qrcard"><div class="qrvisual">${bits.map(x=>`<span class="${x?'on':''}"></span>`).join('')}</div><strong>${esc(m.name)}</strong><small>${esc(m.id)}</small><p class="footnote">Token demo: ${esc(m.token)}</p></div><div><h3>${esc(m.name)}</h3><p class="muted">${esc(m.id)} · ${esc(m.address||'Alamat belum diisi')}</p><p>Token QR demo ini hanya untuk simulasi input dan bukan kode QR produksi yang bisa dipindai.</p><button class="btn" id="printCard">⎙ Cetak kartu</button></div></div>`;$('#printCard').onclick=()=>window.print();$('#qrPanel').scrollIntoView({behavior:'smooth'})});$('#closeQr').onclick=()=>$('#qrPanel').classList.add('hidden');$('#exportMembers').onclick=()=>downloadCSV('anggota-gatak.csv',['ID Anggota','Nama','Jenis Kelamin','Alamat','Status'],members.map(m=>[m.id,m.name,m.gender,m.address,m.active?'Aktif':'Nonaktif']))}
function bindEvents(){$('#addEvent').onclick=()=>$('#eventFormPanel').classList.remove('hidden');$('#closeEventForm').onclick=$('#cancelEvent').onclick=()=>$('#eventFormPanel').classList.add('hidden');$('#eventForm').onsubmit=e=>{e.preventDefault();let id='EVT-'+String(Date.now()).slice(-6);events.push({id,name:$('#eName').value.trim(),theme:$('#eTheme').value.trim(),date:$('#eDate').value,time:$('#eTime').value,location:$('#eLocation').value.trim(),status:'draft'});save();render();toast('Jadwal pengajian berhasil dibuat.');$('#eventFormPanel').classList.add('hidden')};document.querySelectorAll('[data-toggle-event]').forEach(b=>b.onclick=()=>{let ev=events.find(e=>e.id===b.dataset.toggleEvent);if(ev.status==='open'){ev.status='closed';if(activeEvent===ev.id)activeEvent=events.find(e=>e.status==='open')?.id||ev.id;toast('Sesi absensi ditutup.')}else{events.forEach(e=>{if(e.status==='open')e.status='closed'});ev.status='open';activeEvent=ev.id;toast('Sesi absensi dibuka.')}save();render()})}
function bindReports(){['reportEvent','reportDate','reportStatus'].forEach(id=>$('#'+id).onchange=()=>{let vals={event:$('#reportEvent').value,date:$('#reportDate').value,status:$('#reportStatus').value};render();$('#reportEvent').value=vals.event;$('#reportDate').value=vals.date;$('#reportStatus').value=vals.status;bindReports()});$('#exportReport').onclick=()=>{let arr=records.filter(r=>($('#reportEvent').value==='all'||r.eventId===$('#reportEvent').value)&&(!$('#reportDate').value||r.date===$('#reportDate').value)&&($('#reportStatus').value==='all'||r.status===$('#reportStatus').value));downloadCSV('rekap-absensi-gatak.csv',['Tanggal','ID Anggota','Nama','Kegiatan','Waktu','Status','Keterangan'],arr.map(r=>[r.date,r.memberId,members.find(m=>m.id===r.memberId)?.name||'',eventName(r.eventId),fmtTime(r.time),r.status,r.note||'']))};$('#printReport').onclick=()=>window.print()}
function bindSettings(){$('#saveSettings').onclick=()=>toast('Pengaturan demo disimpan secara lokal.');$('#resetDemo').onclick=()=>{if(confirm('Hapus semua perubahan lokal dan kembalikan data demo awal?')){members=JSON.parse(JSON.stringify(seedMembers));events=JSON.parse(JSON.stringify(seedEvents));records=[];activeEvent=events[0].id;save();go('dashboard');toast('Data demo direset.')}}}
function downloadCSV(name,heads,rows){let csv=[heads,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast('File CSV disiapkan.')}
render();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';const k='gatak_supabase_config';const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function mount(){const m=document.querySelector('#main');if(!m||!m.innerHTML.includes('Keamanan dan kesiapan produksi')||document.querySelector('#sbSetup'))return;let cfg={};try{cfg=JSON.parse(localStorage.getItem(k)||'{}')}catch{}const p=document.createElement('section');p.id='sbSetup';p.className='panel';p.innerHTML=`<div class="panelhead"><div><h2>Koneksi Supabase</h2><p>Masukkan Project URL dan Publishable Key.</p></div><span class="status warn" id="sbStatus">Belum diuji</span></div><form id="sbConfig"><div class="formgrid"><div class="formgroup full"><label>Project URL</label><input class="field" id="sbUrl" type="url" required placeholder="https://....supabase.co" value="${safe(cfg.url)}"></div><div class="formgroup full"><label>Publishable Key (sb_publishable_...)</label><input class="field" id="sbKey" required autocomplete="off" placeholder="sb_publishable_..." value="${safe(cfg.key)}"></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" type="submit">Simpan konfigurasi</button><button class="btn" type="button" id="sbTest">Uji koneksi database</button></div></form><div class="notice" id="sbMsg"><strong>Keamanan:</strong> Gunakan hanya Publishable Key di browser. Jangan masukkan service_role/secret key atau kata sandi di kolom konfigurasi. Data demo belum otomatis dipindahkan ke database.</div><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><div class="panelhead"><div><h2>Login Admin Supabase</h2><p>Gunakan akun dari Authentication → Users.</p></div></div><form id="sbLogin"><div class="formgrid"><div class="formgroup"><label>Email admin</label><input class="field" id="sbEmail" type="email" required autocomplete="username"></div><div class="formgroup"><label>Kata sandi admin</label><input class="field" id="sbPass" type="password" required autocomplete="current-password"></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" type="submit">Login &amp; uji akses</button><button class="btn" id="sbLogout" type="button">Logout</button></div></form>`;m.appendChild(p);const msg=document.querySelector('#sbMsg'),st=document.querySelector('#sbStatus');function report(t,ok){msg.innerHTML='<strong>'+(ok?'Berhasil: ':'Perhatian: ')+'</strong>'+safe(t);st.textContent=ok?'Terhubung':'Perlu diperiksa';st.className='status '+(ok?'':'warn')}function client(){const url=document.querySelector('#sbUrl').value.trim(),key=document.querySelector('#sbKey').value.trim();if(!url||!key)throw Error('Isi Project URL dan Publishable Key.');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url))throw Error('Format Project URL belum sesuai.');return window.supabase.createClient(url,key)}document.querySelector('#sbConfig').onsubmit=e=>{e.preventDefault();try{const url=document.querySelector('#sbUrl').value.trim(),key=document.querySelector('#sbKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url))throw Error('Format Project URL belum sesuai.');if(!key.startsWith('sb_publishable_'))throw Error('Gunakan Publishable Key, bukan secret/service_role key.');localStorage.setItem(k,JSON.stringify({url:url.replace(/\/$/,''),key}));report('Konfigurasi disimpan di browser ini. Tekan Uji koneksi database.',true)}catch(e){report(e.message,false)}};document.querySelector('#sbTest').onclick=async()=>{try{const {error}=await client().from('events').select('id').limit(1);if(error)throw error;report('Koneksi berhasil dan tabel events dapat dibaca. Data halaman lain masih lokal.',true)}catch(e){report(e.message||'Koneksi gagal. Periksa URL, key, tabel, dan RLS.',false)}};document.querySelector('#sbLogin').onsubmit=async e=>{e.preventDefault();try{const c=client(),{data,error}=await c.auth.signInWithPassword({email:document.querySelector('#sbEmail').value.trim(),password:document.querySelector('#sbPass').value});if(error)throw error;const {error:dbError}=await c.from('events').select('id').limit(1);if(dbError)throw dbError;report('Login berhasil sebagai '+data.user.email+'. Akses tabel events berhasil; data aplikasi belum disinkronkan.',true)}catch(e){report(e.message||'Login atau akses database gagal.',false)}};document.querySelector('#sbLogout').onclick=async()=>{try{const {error}=await client().auth.signOut();if(error)throw error;report('Sesi admin sudah logout.',true)}catch(e){report(e.message||'Logout gagal.',false)}}}const o=new MutationObserver(mount);o.observe(document.querySelector('#main')||document.body,{childList:true,subtree:true});mount()})();
</script></body></html>
